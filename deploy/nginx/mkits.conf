# MKITS-SupportSuite – nginx reverse proxy configuration (host nginx in front of the Docker container).
# Install: see docs/guides/en/installation.md
#   sudo cp mkits.conf /etc/nginx/sites-available/mkits.conf
#   replace support.example.com, then: sudo ln -s ../sites-available/mkits.conf /etc/nginx/sites-enabled/
#
# Certificates: obtained with certbot (Let's Encrypt), paths below match certbot defaults.

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Request rate limits (per client IP). The application has its own IP ban service on top.
limit_req_zone $binary_remote_addr zone=mkits_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mkits_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=mkits_conn:10m;

upstream mkits_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.example.com;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mkits_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # File transfers are end-to-end encrypted and streamed over WebSockets; this limit only affects HTTP uploads
    # (e.g. recordings uploaded by agents, agent packages uploaded by Admins).
    client_max_body_size 512m;

    limit_conn mkits_conn 50;

    # Forwarding headers. IMPORTANT: nginx does not inherit proxy_set_header into a location that defines
    # its own proxy_set_header – so every location below sets the full list explicitly.
    # X-Forwarded-For is SET (not appended) to the real client address: nginx is the edge, so any
    # client-supplied X-Forwarded-For is discarded. The server's IP ban service relies on this.
    proxy_http_version 1.1;

    # Interactive Blazor pages (admin/supporter UI): SignalR over WebSocket (ADR-0020).
    location /_blazor {
        proxy_pass http://mkits_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # WebSocket endpoints for agents and viewers: long-lived, unbuffered.
    location /ws/ {
        proxy_pass http://mkits_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # Authentication, setup and session-code endpoints: strict rate limit.
    location ~ ^/(api/auth/|account/login|setup|portal/code) {
        limit_req zone=mkits_auth burst=5 nodelay;
        proxy_pass http://mkits_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location / {
        limit_req zone=mkits_general burst=40 nodelay;
        proxy_pass http://mkits_server;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
