version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.AspNetCore.Mvc.Testing"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
    ignore:
      # Node.js: LTS releases (even majors) only – odd majors are short-lived "current" releases.
      - dependency-name: "node"
        versions: [">=23 <24", ">=25 <26", ">=27 <28", ">=29 <30"]
