version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Microsoft.AspNetCore.Mvc.Testing"]
      # Avalonia packages always move together (one PR instead of one per package).
      avalonia:
        patterns: ["Avalonia*"]
    ignore:
      # Avalonia 12 is a breaking major release; it also pulls Tmds.DBus.Protocol 0.9x, while the Linux agent pins the
      # 0.21 line Avalonia 11 uses (ADR-0026). Upgrading both is a planned change, not a routine bump.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Tmds.DBus.Protocol"
        versions: [">=0.22"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
    ignore:
      # Node.js: LTS releases (even majors) only – odd majors are short-lived "current" releases.
      - dependency-name: "node"
        versions: [">=23 <24", ">=25 <26", ">=27 <28", ">=29 <30"]
