name: CI

on:
  push:
    branches: [main]
  pull_request: # any base branch, so stacked PRs are checked too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Viewer/web/package-lock.json

      # Browser viewer: type check, tests (incl. the shared E2E test vector) and the bundle served by the server.
      - name: Browser viewer
        working-directory: src/Viewer/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # Linux agent platform tests: X server (Xvfb), XTest, XRandR and libjpeg-turbo.
      - name: Linux agent test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libxtst6 libxrandr2 libturbojpeg

      - name: Restore
        run: dotnet restore MKITS.SupportSuite.slnx "-flp:ErrorsOnly;LogFile=build-errors.log"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format MKITS.SupportSuite.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MKITS.SupportSuite.slnx -c Release --no-restore "-flp:ErrorsOnly;LogFile=build-errors.log"

      - name: Report build errors as annotations
        if: failure()
        shell: python
        run: |
          # Full error texts (incl. multi-line messages and errors without a file) for environments without log access.
          import os
          if os.path.exists("build-errors.log"):
              for line in sorted(set(open("build-errors.log", encoding="utf-8", errors="replace").read().splitlines())):
                  if line.strip():
                      print("::error title=Build error::" + line.strip()[:1500].replace("%", "%25"))

      - name: Test
        run: dotnet test MKITS.SupportSuite.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Report failed tests as annotations
        if: failure()
        shell: python
        run: |
          # Makes failing tests visible in the checks UI/API without opening the logs.
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  if result.get("outcome") != "Failed":
                      continue
                  message = result.find(".//t:Message", ns)
                  stack = result.find(".//t:StackTrace", ns)
                  text = (message.text or "") if message is not None else ""
                  # Only our own frames from the stack trace – enough to find the failing line.
                  frames = [l.strip() for l in ((stack.text or "") if stack is not None else "").splitlines() if "MKITS" in l]
                  text = " ".join(text.split())[:700] + (" | at " + " <- ".join(frames[:4]) if frames else "")
                  print(f"::error title=Test failed: {result.get('testName')}::{text[:1800].replace('%', '%25')}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  windows-client:
    name: Windows client (portable EXE)
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file EXE
        run: >
          dotnet publish src/Agent/MKITS.SupportSuite.Agent.Windows/MKITS.SupportSuite.Agent.Windows.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish/windows-x64

      # Unsigned development build (code signing: ADR-0009). Copy it to /data/agents/windows-x64/ on a test server.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MKITS-Support-windows-x64
          path: publish/windows-x64/MKITS-Support.exe
          if-no-files-found: error
          retention-days: 14

  # The Linux agent's native interop (Xlib, libjpeg-turbo, libc structs) on 64-bit ARM.
  linux-arm64-tests:
    name: Linux agent tests (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Dependencies (Xvfb, XTest, XRandR, libjpeg-turbo)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb libxtst6 libxrandr2 libturbojpeg

      - name: Test
        run: dotnet test tests/MKITS.SupportSuite.Agent.Linux.Tests -c Release

  linux-client:
    name: Linux client (AppImage, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, appimage: x86_64, deb: amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, appimage: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    needs: build-test
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Dependencies (libjpeg-turbo to bundle, Xvfb for the smoke test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libturbojpeg xvfb xauth libxtst6 libxrandr2

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # no FUSE on the runner
        run: deploy/linux/build-appimage.sh artifacts/linux

      # The terminal mode without a target prints the usage and exits with 2; the graphical mode must keep running.
      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          xvfb-run -a artifacts/linux/MKITS-Support-${{ matrix.appimage }}.AppImage --terminal
          code=$?
          [ "$code" -eq 2 ] || { echo "::error::terminal mode exited with $code (expected 2)"; exit 1; }
          timeout 15 xvfb-run -a artifacts/linux/MKITS-Support-${{ matrix.appimage }}.AppImage
          code=$?
          [ "$code" -eq 124 ] || { echo "::error::graphical client exited early with $code"; exit 1; }

      # Unsigned development build. Copy it to /data/agents/linux-<arch>/MKITS-Support.AppImage on a test server.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MKITS-Support-linux-${{ matrix.arch }}
          path: artifacts/linux/MKITS-Support-${{ matrix.appimage }}.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-agent:
    name: Linux agent (.deb, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, appimage: x86_64, deb: amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, appimage: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    needs: build-test
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Dependencies (libjpeg-turbo to bundle)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libturbojpeg

      - name: Build package
        run: BUILD_NUMBER=1 deploy/linux/build-deb.sh artifacts/linux

      # Install, configure, check the service and the root-only files, disconnect, purge. The configured server is not
      # reachable: the service must keep running (retrying) instead of stopping.
      - name: Install and configure
        run: |
          set -eu
          deb="$(ls artifacts/linux/mkits-agent_*_${{ matrix.deb }}.deb)"
          dpkg-deb --info "$deb"
          sudo apt-get install -y -q "./$deb"
          systemd-analyze verify /usr/lib/systemd/system/mkits-agent.service
          set +e
          mkits-agent --install; code=$?
          [ "$code" -eq 2 ] || { echo "::error::--install without arguments exited with $code (expected 2)"; exit 1; }
          mkits-agent --install --server https://localhost:9 --token test; code=$?
          [ "$code" -eq 5 ] || { echo "::error::--install as non-root exited with $code (expected 5)"; exit 1; }
          set -e
          sudo mkits-agent --install --server https://localhost:9 --token test-token
          sleep 5
          systemctl is-active mkits-agent
          systemctl is-enabled mkits-agent
          [ "$(sudo stat -c %a /etc/mkits-agent)" = 700 ]
          [ "$(sudo stat -c %a /etc/mkits-agent/agent.json)" = 600 ]
          sudo journalctl -u mkits-agent --no-pager | grep -q "service starting"

      - name: Uninstall and purge
        run: |
          set -eu
          sudo mkits-agent --uninstall
          if systemctl is-active --quiet mkits-agent; then echo "::error::service still running"; exit 1; fi
          [ ! -e /etc/mkits-agent ]
          sudo apt-get purge -y -q mkits-agent
          [ ! -e /opt/mkits-agent ]
          [ ! -e /usr/lib/systemd/system/mkits-agent.service ]

      - name: Service log
        if: always()
        run: sudo journalctl -u mkits-agent --no-pager || true

      # Unsigned development build.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mkits-agent-linux-${{ matrix.deb }}-deb
          path: artifacts/linux/mkits-agent_*_${{ matrix.deb }}.deb
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image (server)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: mkits-server:ci
          build-args: |
            BUILD_NUMBER=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (hardened container as in docker-compose.yml)
        run: |
          docker run -d --name mkits-smoke -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e Mkits__PublicBaseUrl=https://support.example.test \
            -v mkits-smoke-data:/data mkits-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/system/version
          echo
          # The bundled Windows client must be in the image (portal and admin agent download).
          docker exec mkits-smoke test -s /app/agents/windows-x64/MKITS-Support.exe
          docker exec mkits-smoke test -s /app/agents/linux-x64/MKITS-Support.AppImage
          docker exec mkits-smoke test -s /app/agents/linux-x64/mkits-agent_amd64.deb
          docker exec mkits-smoke test -s /app/agents/linux-arm64/MKITS-Support.AppImage
          docker exec mkits-smoke test -s /app/agents/linux-arm64/mkits-agent_arm64.deb
          docker logs mkits-smoke
          docker rm -f mkits-smoke
