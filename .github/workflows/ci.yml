name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MKITS.SupportSuite.slnx

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format MKITS.SupportSuite.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MKITS.SupportSuite.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MKITS.SupportSuite.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  docker:
    name: Docker image (server)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: mkits-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (hardened container as in docker-compose.yml)
        run: |
          docker run -d --name mkits-smoke -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e Mkits__PublicBaseUrl=https://support.example.test \
            -v mkits-smoke-data:/data mkits-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/system/version
          echo
          docker logs mkits-smoke
          docker rm -f mkits-smoke
