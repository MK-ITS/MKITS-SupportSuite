name: CodeQL

on:
  push:
    branches: [main]
  pull_request: # any base branch, so stacked PRs are checked too
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build MKITS.SupportSuite.slnx -c Release "-flp:ErrorsOnly;LogFile=build-errors.log"

      - name: Report build errors as annotations
        if: failure()
        shell: python
        run: |
          import os
          if os.path.exists("build-errors.log"):
              for line in sorted(set(open("build-errors.log", encoding="utf-8", errors="replace").read().splitlines())):
                  if line.strip():
                      print("::error title=Build error::" + line.strip()[:1500].replace("%", "%25"))

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
