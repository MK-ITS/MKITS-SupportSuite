name: CodeQL

on:
  push:
    branches: [main]
  pull_request: # any base branch, so stacked PRs are checked too
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build MKITS.SupportSuite.slnx -c Release "-flp:ErrorsOnly;LogFile=build-errors.log"

      - name: Report build errors as annotations
        if: failure()
        shell: python
        run: |
          import os
          if os.path.exists("build-errors.log"):
              for line in sorted(set(open("build-errors.log", encoding="utf-8", errors="replace").read().splitlines())):
                  if line.strip():
                      print("::error title=Build error::" + line.strip()[:1500].replace("%", "%25"))

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
