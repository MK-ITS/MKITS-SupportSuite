name: Publish server image

# Publishes the server image to GitHub Container Registry (ghcr.io/mk-its/mkits-supportsuite-server).
#   push to main  -> tag "edge"
#   tag v1.2.3    -> tags "1.2.3", "1.2", "latest"

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Orders agent updates (ADR-0023): commit timestamp, increasing along main.
      - name: Build number
        id: build
        run: echo "number=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mk-its/mkits-supportsuite-server
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_NUMBER=${{ steps.build.outputs.number }}
          # Release key for agent updates (PKCS#8 PEM, ECDSA P-256). Without it the image is built unsigned.
          secrets: |
            agent_update_key=${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
