name: Publish server image

# Publishes the server image to GitHub Container Registry (ghcr.io/mk-its/mkits-supportsuite-server).
#   push to main    -> tag "edge" (version x.y.z-dev)
#   tag v1.2.3      -> tags "1.2.3", "1.2", "latest" and a GitHub release with the clients (docs/releasing.md)
#   tag v1.2.3-rc.1 -> tag "1.2.3-rc.1" and a pre-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release tags must match VersionPrefix in Directory.Build.props; the part after "-" becomes the suffix.
      - name: Version
        id: version
        env:
          HAS_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY != '' }}
        run: |
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            core="${version%%-*}"
            suffix=""
            [[ "$version" == *-* ]] && suffix="${version#*-}"
            if [[ "$core" != "$prefix" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props."
              exit 1
            fi
            # A release without signed updates would leave installed agents behind (ADR-0023).
            if [[ "$HAS_SIGNING_KEY" != "true" || ! -s deploy/keys/agent-update.pub ]]; then
              echo "::error::Releases need the agent update release key (secret AGENT_UPDATE_SIGNING_KEY and deploy/keys/agent-update.pub, docs/development.md)."
              exit 1
            fi
            {
              echo "version=$version"
              echo "suffix=$suffix"
              echo "label=$GITHUB_REF_NAME"
              echo "prerelease=$([[ -n "$suffix" ]] && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
          else
            { echo "version=$prefix-dev"; echo "suffix=dev"; echo "label="; echo "prerelease=false"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Orders agent updates (ADR-0023): commit timestamp, increasing along main.
      - name: Build number
        id: build
        run: echo "number=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mk-its/mkits-supportsuite-server
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.prerelease == 'false' }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_NUMBER=${{ steps.build.outputs.number }}
            VERSION_SUFFIX=${{ steps.version.outputs.suffix }}
            UPDATE_LABEL=${{ steps.version.outputs.label }}
          # Release key for agent updates (PKCS#8 PEM, ECDSA P-256). Without it the image is built unsigned.
          secrets: |
            agent_update_key=${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verifiable with: gh attestation verify oci://ghcr.io/mk-its/mkits-supportsuite-server:<tag> --repo MK-ITS/MKITS-SupportSuite
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mk-its/mkits-supportsuite-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # artifact metadata records are an organization feature; not used here

  # GitHub release with the clients exactly as the image serves them (same build, same signatures).
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the clients from the image
        env:
          IMAGE: ghcr.io/mk-its/mkits-supportsuite-server@${{ needs.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          container="$(docker create "$IMAGE")"
          docker cp "$container:/app/agents" agents
          docker rm "$container"
          mkdir dist
          cp agents/windows-x64/MKITS-Support.exe "dist/MKITS-Support-$VERSION-windows-x64.exe"
          cp agents/linux-x64/MKITS-Support.AppImage "dist/MKITS-Support-$VERSION-x86_64.AppImage"
          cp agents/linux-arm64/MKITS-Support.AppImage "dist/MKITS-Support-$VERSION-aarch64.AppImage"
          cp agents/linux-x64/mkits-agent_amd64.deb "dist/mkits-agent_${VERSION}_amd64.deb"
          cp agents/linux-arm64/mkits-agent_arm64.deb "dist/mkits-agent_${VERSION}_arm64.deb"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      # Verifiable with: gh attestation verify <file> --repo MK-ITS/MKITS-SupportSuite
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Final releases need a dated section "## [x.y.z] - YYYY-MM-DD"; pre-releases use the section of x.y.z.
      - name: Release notes from CHANGELOG.md
        env:
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          section="${VERSION%%-*}"
          if [[ "$PRERELEASE" != "true" ]] && ! grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated section: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi
          awk -v version="$section" '
            /^## \[/ { if (found) exit; found = index($0, "## [" version "]") == 1; next }
            found && !/^\[[^]]*\]: / { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section [$section]."
            exit 1
          fi
          {
            echo
            echo "Server image: \`ghcr.io/mk-its/mkits-supportsuite-server:$VERSION\` (\`${{ needs.image.outputs.digest }}\`)."
            echo "Check files with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
